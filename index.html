<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sörlabor / BeerLab / Bierlabor – otthoni sörfőzés laborpontossággal: receptépítő, élő számítások, főzőnap mód és kalibráció." />
    <meta name="theme-color" content="#0f0b08" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Sörlabor" />
    <title>Sörlabor</title>
    <!-- téma beállítása a React betöltése előtt (ne villanjon a rossz téma) – külön fájlban a szigorú CSP miatt -->
    <script src="./theme-init.js"></script>
    <style>
      /* első festés: sötét háttér villanás nélkül, egyszerű betöltésjelző */
      html, body { margin: 0; background: #0f0b08; }
      :root[data-theme='light'] body:has(.app) { background: #f6f1e9; }
      .boot-loader { min-height: 100vh; display: grid; place-items: center; font-size: 42px; }
      .boot-loader span { animation: boot 1s ease-in-out infinite alternate; }
      @keyframes boot { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-10px) rotate(8deg); } }
      @media (prefers-reduced-motion: reduce) { .boot-loader span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
